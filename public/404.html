<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Zoko-Master</title>
    <script>
      // GitHub Pages SPA redirect
      // Carry the route in the URL, never in browser data storage.
      const route = location.pathname + location.search + location.hash;
      location.replace(location.pathname.split('/').slice(0, 2).join('/') + '/#spa-route=' + encodeURIComponent(route));
    </script>
  </head>
  <body></body>
</html>
